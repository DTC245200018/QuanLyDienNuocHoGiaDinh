{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}

{% block login %}
<div class="login-page">
  <div class="login-card">
    <h1>⚡ QL Điện Nước</h1>
    <p class="subtitle">Hệ thống quản lý hóa đơn hộ gia đình</p>
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/dang-nhap">
      <div class="form-group">
        <label>Tên đăng nhập</label>
        <input type="text" name="username" required value="admin">
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" name="password" required value="admin123">
      </div>
      <button class="btn btn-block" type="submit">Đăng nhập</button>
    </form>
    <p style="margin-top:16px;text-align:center;font-size:.82rem;color:#94a3b8;">
      Tài khoản mẫu: admin / admin123
    </p>
  </div>
</div>
{% endblock %}
